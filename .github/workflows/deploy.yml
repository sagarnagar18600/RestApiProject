name: Deploy to Azure VM

on:
  push:
    branches: ["feature/prod"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (CI side)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            # Use strict but avoid -e because the SSH action wrapper aborts on non-zero in conditionals.
            set -xuo pipefail

            echo "==> Ensure Docker and git installed"
            command -v docker >/dev/null 2>&1 || {
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            }
            command -v git >/dev/null 2>&1 || {
              sudo apt-get update
              sudo apt-get install -y git
            }

            echo "==> Prepare app directory and source"
            APP_DIR="/home/${USER}/app"
            REPO_URL="https://github.com/sagarnagar18600/RestApiProject.git"
            BRANCH="feature/prod"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Idempotent repo setup: init, set remote, fetch, checkout branch tracking remote
            git init
            # Reset 'origin' remote to the desired URL
            git remote remove origin >/dev/null 2>&1 || true
            git remote add origin "$REPO_URL" >/dev/null 2>&1 || true

            # Fetch latest from origin
            git fetch --depth=1 origin "$BRANCH"

            # Create/overwrite local branch to track remote branch
            git checkout -B "$BRANCH" "origin/$BRANCH"

            echo "==> Build Docker image"
            sudo docker build --pull -t flaskapp:latest .

            echo "==> Restart container if exists"
            sudo docker stop flaskapp >/dev/null 2>&1 || true
            sudo docker rm flaskapp >/dev/null 2>&1 || true

            echo "==> Run container on port 80 -> 8000 (no JWT secret env)"
            sudo docker run -d --name flaskapp \
              --restart unless-stopped \
              -p 80:8000 \
              -e DATABASE_URL="${{ secrets.DB_CONN }}" \
              -e FLASK_ENV=production \
              flaskapp:latest

            echo "==> Check container status"
            sudo docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Names}}"

            echo "==> Tail container logs (short)"
            sleep 3
            sudo docker logs --tail=100 flaskapp || true

            echo "==> Deployment complete."

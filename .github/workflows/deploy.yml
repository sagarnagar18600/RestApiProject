name: Deploy to Azure VM

on:
  push:
    branches: ["feature/prod"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (CI side)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -euxo pipefail

            echo "==> Ensure Docker and git installed"
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
              sudo systemctl enable docker
              sudo systemctl start docker
            fi
            if ! command -v git >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y git
            fi

            echo "==> Prepare app directory"
            APP_DIR="/home/${USER}/app"
            REPO_URL="https://github.com/sagarnagar18600/RestApiProject.git"
            BRANCH="feature/prod"

            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
              cd "$APP_DIR"
              git clone "$REPO_URL" .
            else
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL"
              git fetch --all --prune
            fi

            echo "==> Checkout branch: ${BRANCH}"
            git checkout "${BRANCH}"
            git pull origin "${BRANCH}"

            echo "==> Build Docker image"
            sudo docker build --pull -t flaskapp:latest .

            echo "==> Restart container if exists"
            sudo docker stop flaskapp || true
            sudo docker rm flaskapp || true

            echo "==> Quick check: is VM port 80 free?"
            # This is informational only; will NOT modify services.
            if sudo ss -tulpn | grep -qE 'LISTEN.*:80'; then
              echo "WARNING: Port 80 appears in use. The next docker run may fail to bind."
              sudo ss -tulpn | grep -E 'LISTEN.*:80' || true
            fi

            echo "==> Run container on port 80 -> 8000"
            # If port 80 is busy, this will fail; that's intentional per your request.
            sudo docker run -d --name flaskapp \
              --restart unless-stopped \
              -p 80:8000 \
              -e DATABASE_URL="${{ secrets.DB_CONN }}" \
              -e FLASK_ENV=production \
              flaskapp:latest

            echo "==> Check container status"
            sudo docker ps --format "table {{.ID}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}\t{{.Names}}"

            echo "==> Tail container logs (short)"
            sleep 3
            sudo docker logs --tail=100 flaskapp || true

            echo "==> Deployment complete."
